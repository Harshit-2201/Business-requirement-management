# ==========================================================
# Spring Boot Application Properties
# Zero-Knowledge Secure Password Manager
# ==========================================================

spring.application.name=secure-password-manager
server.port=8080

# --- Database Configuration (MySQL) ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/password_manager_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:pm_user}
spring.datasource.password=${DB_PASSWORD:pm_password_123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate Configuration ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# --- JWT Configuration ---
# 256-bit+ secure base64 secret for HMAC-SHA256
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# --- Zero-Knowledge / Security Defaults ---
# Argon2id parameters
app.security.argon2.memory-cost=65536
app.security.argon2.time-cost=3
app.security.argon2.parallelism=1
app.security.argon2.salt-length=16
app.security.argon2.hash-length=32

# Rate Limiting Configuration (requests per minute for auth endpoints)
app.security.rate-limit.auth-capacity=10
app.security.rate-limit.auth-refill-tokens=10
app.security.rate-limit.auth-refill-duration-minutes=1

# --- Springdoc / Swagger OpenAPI Configuration ---
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# --- Logging Configuration ---
logging.level.root=INFO
logging.level.com.passwordmanager=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
